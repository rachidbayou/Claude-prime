<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météo Paris</title>
  <meta name="theme-color" content="#c15f3c">
  <link rel="stylesheet" href="style.css">
  <style>
    .now { font-size: 3rem; font-weight: 600; margin: .5rem 0 0; }
    .cond { color: var(--muted); margin: 0 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem .25rem; border-bottom: 1px solid rgba(127,127,127,.25); }
    .src { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Météo à Paris</h1>
    <p class="now" id="temp">…</p>
    <p class="cond" id="cond">Chargement en cours</p>
    <table>
      <thead><tr><th>Jour</th><th>Min</th><th>Max</th><th>Pluie</th></tr></thead>
      <tbody id="days"></tbody>
    </table>
    <p class="src">Données : <a href="https://open-meteo.com/">Open-Meteo</a>, mises à jour à chaque ouverture de la page.</p>
    <p><a href="index.html">← Retour à l'accueil</a></p>
  </main>
  <footer>
    <a href="https://github.com/rachidbayou/Claude-prime">Code source sur GitHub</a>
  </footer>
  <script>
    const url = "https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522"
      + "&current=temperature_2m,weather_code"
      + "&daily=temperature_2m_min,temperature_2m_max,precipitation_sum"
      + "&timezone=Europe%2FParis&forecast_days=5";

    // Codes météo WMO regroupés
    function label(code) {
      if (code === 0) return "Ciel dégagé";
      if (code <= 3) return "Nuageux";
      if (code <= 48) return "Brouillard";
      if (code <= 57) return "Bruine";
      if (code <= 67) return "Pluie";
      if (code <= 77) return "Neige";
      if (code <= 82) return "Averses";
      if (code <= 86) return "Averses de neige";
      return "Orage";
    }

    fetch(url)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        document.getElementById("temp").textContent = Math.round(d.current.temperature_2m) + " °C";
        document.getElementById("cond").textContent = label(d.current.weather_code);
        const fmt = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "short" });
        document.getElementById("days").innerHTML = d.daily.time.map((t, i) =>
          `<tr><td>${fmt.format(new Date(t))}</td>`
          + `<td>${Math.round(d.daily.temperature_2m_min[i])} °C</td>`
          + `<td>${Math.round(d.daily.temperature_2m_max[i])} °C</td>`
          + `<td>${d.daily.precipitation_sum[i]} mm</td></tr>`).join("");
      })
      .catch(() => {
        document.getElementById("temp").textContent = "—";
        document.getElementById("cond").textContent = "Météo indisponible pour le moment. Réessaie plus tard.";
      });
  </script>
</body>
</html>
